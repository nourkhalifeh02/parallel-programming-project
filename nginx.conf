user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    map $http_cookie $is_vip {
        default 0;
        ~*isVip=1 1;
    }

    upstream regular_backend {
        least_conn;
        server 127.0.0.1:8002 weight=1;
        server 127.0.0.1:8003 weight=2;
        server 127.0.0.1:8004 weight=2;
        server 127.0.0.1:8005 weight=2;
        keepalive 64;
    }

    upstream vip_backend {
        least_conn;
        server 127.0.0.1:8000;
        server 127.0.0.1:8001;
        keepalive 64;
    }

    server {
        listen 9000;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            set $backend regular_backend;
            if ($is_vip = 1) {
                set $backend vip_backend;
            }
            proxy_pass http://$backend;
        }

        location / {
            proxy_pass http://regular_backend;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
