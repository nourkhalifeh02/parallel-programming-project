upstream regular_backend {
    server 127.0.0.1:8000;
}

upstream vip_backend {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name your-domain.com;

    # VIP users route to vip pool
    location / {
        # Check for isVip cookie - route to VIP pool if value is '1'
        set $backend regular_backend;
        
        # If isVip cookie is set to '1', use VIP pool
        # Note: The cookie must be accessible in the request
        # Adjust the regex based on your cookie naming
        
        # Option 1: Using map for cleaner logic
        # Add this outside server block:
        # map $http_cookie $is_vip {
        #     default 0;
        #     ~*isVip=1 1;
        # }
        
        # Then use: 
        # if ($is_vip) {
        #     proxy_pass http://vip_backend;
        # }
        
        # Option 2: Using if condition directly
        if ($http_cookie ~* "isVip=1") {
            set $backend vip_backend;
        }

        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket support if needed
    location /ws/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}